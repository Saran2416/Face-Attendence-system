<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - BioSecure AI</title>
  <meta name="description" content="Secure login portal for BioSecure AI attendance dashboard." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #050505; --panel: #202020; --border: #383838; --text: #fff; --muted: #9ca3af; --danger: #f87171; }
    html, body { min-height: 100%; }
    body {
      min-height: 100vh;
      overflow-x: hidden;
      background: radial-gradient(ellipse 46% 30% at 50% -7%, rgba(255,255,255,.25), rgba(140,140,140,.08) 38%, transparent 72%), linear-gradient(180deg, #080808 0%, var(--bg) 45%, #030303 100%);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body::before {
      content: "";
      position: fixed;
      inset: -12% 0 auto;
      height: 52vh;
      pointer-events: none;
      background: radial-gradient(ellipse at top center, rgba(255,255,255,.18), rgba(255,255,255,.045) 35%, transparent 68%);
      filter: blur(18px);
      animation: glow-breathe 8s ease-in-out infinite alternate;
    }
    .auth-page { position: relative; min-height: 100vh; display: grid; place-items: center; padding: 32px 20px; }
    .auth-shell { width: min(100%, 336px); animation: auth-in .7s cubic-bezier(.22, 1, .36, 1) both; }
    .brand { text-align: center; margin-bottom: 28px; }
    .brand-mark {
      display: inline-flex; align-items: center; justify-content: center;
      width: 44px; height: 44px; margin-bottom: 18px;
      border: 1px solid rgba(255,255,255,.14); border-radius: 50%;
      background: rgba(255,255,255,.035); color: #f7f7f7;
    }
    h1 { color: #fff; font-size: clamp(28px, 7vw, 32px); font-weight: 600; line-height: 1.15; letter-spacing: 0; margin-bottom: 10px; }
    .brand p { color: var(--muted); font-size: 14px; line-height: 1.55; }
    .alert {
      display: flex; gap: 10px; align-items: flex-start; margin-bottom: 18px; padding: 12px 13px;
      border: 1px solid rgba(248,113,113,.26); border-radius: 10px; background: rgba(248,113,113,.08);
      color: var(--danger); font-size: 13px; line-height: 1.45;
    }
    .alert.info { border-color: rgba(156,163,175,.28); background: rgba(255,255,255,.055); color: #d1d5db; }
    .social-stack, .form-stack { display: grid; gap: 10px; }
    .social-btn, .btn-login {
      width: 100%; height: 46px; border-radius: 9px; font: inherit; font-size: 14px; font-weight: 600;
      transition: transform .18s ease, filter .18s ease, background-color .18s ease, border-color .18s ease;
    }
    .social-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      border: 0; background: #f5f5f5; color: #111; text-decoration: none;
    }
    .social-btn:hover { filter: brightness(.92); transform: translateY(-1px) scale(1.01); }
    .social-btn svg { flex: 0 0 auto; }
    .divider {
      display: flex; align-items: center; gap: 13px; margin: 22px 0; color: #737373;
      font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, #2f2f2f, transparent); }
    .field { position: relative; display: block; }
    .field input {
      width: 100%; height: 46px; padding: 0 44px; border: 1px solid var(--border); border-radius: 9px;
      outline: none; background: var(--panel); color: #fff; font: inherit; font-size: 14px;
      transition: border-color .2s ease, box-shadow .2s ease, background-color .2s ease;
    }
    .field input::placeholder { color: #777; }
    .field input:focus { border-color: #666; background: #222; box-shadow: 0 0 0 3px rgba(255,255,255,.055), 0 0 24px rgba(255,255,255,.04); }
    .field-icon, .eye-btn { position: absolute; top: 50%; transform: translateY(-50%); color: #858585; }
    .field-icon { left: 14px; display: flex; pointer-events: none; }
    .eye-btn {
      right: 11px; display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px;
      border: 0; background: transparent; cursor: pointer; border-radius: 7px; transition: color .2s ease, background-color .2s ease;
    }
    .eye-btn:hover { color: #fff; background: rgba(255,255,255,.06); }
    .btn-login { position: relative; border: 1px solid #3a3a3a; background: #2b2b2b; color: #fff; cursor: pointer; margin-top: 2px; }
    .btn-login:hover { background: #343434; transform: translateY(-1px); }
    .btn-login:disabled { cursor: wait; opacity: .58; transform: none; }
    .btn-content { display: flex; align-items: center; justify-content: center; gap: 9px; }
    .spinner { display: none; width: 17px; height: 17px; border: 2px solid rgba(255,255,255,.28); border-top-color: #fff; border-radius: 50%; animation: spin .75s linear infinite; }
    .btn-login.loading .btn-text { display: none; }
    .btn-login.loading .spinner { display: block; }
    .auth-footer { margin-top: 22px; text-align: center; color: #777; font-size: 12px; line-height: 1.5; }
    @keyframes auth-in { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes glow-breathe { from { opacity: .55; transform: translateY(-8px) scale(.96); } to { opacity: .9; transform: translateY(8px) scale(1.04); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 480px) { .auth-page { padding-inline: 5vw; } .auth-shell { width: 90vw; max-width: 336px; } .brand { margin-bottom: 24px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; } }
  </style>
</head>
<body>
  <main class="auth-page">
    <section class="auth-shell" aria-labelledby="auth-title">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7V5a2 2 0 0 1 2-2h2" /><path d="M17 3h2a2 2 0 0 1 2 2v2" /><path d="M21 17v2a2 2 0 0 1-2 2h-2" /><path d="M7 21H5a2 2 0 0 1-2-2v-2" /><path d="M8 14s1.5 2 4 2 4-2 4-2" /><path d="M9 9h.01" /><path d="M15 9h.01" />
          </svg>
        </div>
        <h1 id="auth-title">Welcome to BioSecure AI</h1>
        <p>Sign in to access your secure attendance dashboard.</p>
      </div>

      {% if error %}
      <div class="alert" role="alert">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10" /><path d="M12 8v4" /><path d="M12 16h.01" /></svg>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      {% if info %}
      <div class="alert info" role="status"><span>{{ info }}</span></div>
      {% endif %}

      <div class="social-stack" aria-label="Social sign in options">
        <a href="/login/oauth/google" class="social-btn">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06L5.84 9.9C6.71 7.31 9.14 5.38 12 5.38z"/>
          </svg>
          <span>Continue with Google</span>
        </a>
        <a href="/login/oauth/github" class="social-btn">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M12 1.5a10.5 10.5 0 0 0-3.32 20.46c.53.1.72-.23.72-.51v-1.79c-2.94.64-3.56-1.42-3.56-1.42-.48-1.23-1.17-1.56-1.17-1.56-.96-.66.07-.64.07-.64 1.07.07 1.62 1.09 1.62 1.09.94 1.61 2.47 1.15 3.08.88.09-.68.37-1.15.67-1.41-2.35-.27-4.82-1.18-4.82-5.23 0-1.16.41-2.1 1.09-2.85-.11-.27-.47-1.35.1-2.81 0 0 .89-.28 2.9 1.08a10.04 10.04 0 0 1 5.28 0c2.01-1.36 2.9-1.08 2.9-1.08.57 1.46.21 2.54.1 2.81.68.75 1.09 1.69 1.09 2.85 0 4.06-2.48 4.96-4.84 5.22.38.33.72.97.72 1.96v2.9c0 .28.19.61.73.51A10.5 10.5 0 0 0 12 1.5z"/></svg>
          <span>Continue with GitHub</span>
        </a>
      </div>

      <div class="divider"><span>or</span></div>

      <form id="login-form" action="/login" method="POST" novalidate>
        <div class="form-stack">
          <label class="field" for="email">
            <span class="field-icon" aria-hidden="true"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2" /><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" /></svg></span>
            <input id="email" name="email" type="email" placeholder="Enter your email" required autocomplete="email" spellcheck="false" />
          </label>

          <label class="field" for="password">
            <span class="field-icon" aria-hidden="true"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></svg></span>
            <input id="password" name="password" type="password" placeholder="Password" required autocomplete="current-password" />
            <button type="button" class="eye-btn" id="eye-toggle" aria-label="Toggle password visibility"><svg id="eye-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z" /><circle cx="12" cy="12" r="3" /></svg></button>
          </label>

          <button type="submit" class="btn-login" id="login-btn">
            <span class="btn-content"><span class="btn-text">Sign In</span><span class="spinner" aria-hidden="true"></span></span>
          </button>
        </div>
      </form>

      <p class="auth-footer">Protected by encrypted authentication and AI-powered attendance security.</p>
    </section>
  </main>

  <script>
    const pwdInput = document.getElementById('password');
    const eyeBtn = document.getElementById('eye-toggle');
    const eyeIcon = document.getElementById('eye-icon');
    const eyeOpen = '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>';
    const eyeOff = '<path d="M9.88 9.88A3 3 0 0 0 14.12 14.12"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c6.5 0 10 7 10 7a13.38 13.38 0 0 1-1.67 2.68"/><path d="M6.61 6.61C3.62 8.43 2 12 2 12s3.5 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><path d="m2 2 20 20"/>';
    eyeBtn.addEventListener('click', () => {
      const show = pwdInput.type === 'password';
      pwdInput.type = show ? 'text' : 'password';
      eyeIcon.innerHTML = show ? eyeOff : eyeOpen;
    });
    document.getElementById('login-form').addEventListener('submit', function () {
      const btn = document.getElementById('login-btn');
      btn.classList.add('loading');
      btn.disabled = true;
      setTimeout(() => { btn.classList.remove('loading'); btn.disabled = false; }, 8000);
    });
    document.getElementById('email').focus();
    if (window.location.search && window.history.replaceState) {
      const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
      window.history.replaceState({ path: cleanUrl }, '', cleanUrl);
    }
  </script>
  <script src="{{ url_for('static', filename='js/offline-detector.js') }}"></script>
</body>
</html>
