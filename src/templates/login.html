<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Face Attendance System</title>
  <meta name="description" content="Secure login portal for the Face Attendance System." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --text: #0f172a;
      --muted: #64748b;
      --muted-light: #94a3b8;
      --primary: #0f172a;
      --primary-hover: #1e293b;
      --ring: rgba(15, 23, 42, 0.12);
      --error-bg: #fef2f2;
      --error-border: #fecaca;
      --error-text: #b91c1c;
      --radius: 12px;
    }

    html, body { height: 100%; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Top bar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 960px;
      width: 100%;
      margin: 0 auto;
      padding: 20px 24px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.1px;
    }

    .logo-mark {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-mark svg { width: 15px; height: 15px; }

    .topbar-link {
      font-size: 13px;
      color: var(--muted);
      text-decoration: none;
    }

    .topbar-link:hover { color: var(--text); }

    /* Layout */
    .page {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
    }

    .card h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin-bottom: 6px;
    }

    .card .subtitle {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 24px;
    }

    /* Error */
    .error-banner {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      border-radius: 10px;
      padding: 11px 13px;
      margin-bottom: 20px;
      font-size: 13px;
      color: var(--error-text);
      line-height: 1.45;
    }

    .error-banner svg { flex-shrink: 0; width: 16px; height: 16px; margin-top: 1px; }

    /* Form */
    .field { margin-bottom: 16px; }

    .field-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 7px;
    }

    .field label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
    }

    .field-row a {
      font-size: 13px;
      color: var(--muted);
      text-decoration: none;
    }

    .field-row a:hover { color: var(--text); text-decoration: underline; }

    .input-wrap { position: relative; }

    .input-wrap input {
      width: 100%;
      height: 42px;
      padding: 0 40px 0 13px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
      background: #fff;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .input-wrap input::placeholder { color: var(--muted-light); }

    .input-wrap input:focus {
      border-color: var(--border-strong);
      box-shadow: 0 0 0 3px var(--ring);
    }

    .eye-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted-light);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      border-radius: 7px;
    }

    .eye-btn:hover { color: var(--text); background: #f1f5f9; }

    /* Submit */
    .btn-login {
      width: 100%;
      height: 42px;
      margin-top: 6px;
      border: none;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s;
    }

    .btn-login:hover { background: var(--primary-hover); }
    .btn-login:disabled { opacity: 0.7; cursor: not-allowed; }

    .btn-login .spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .btn-login.loading .btn-text { display: none; }
    .btn-login.loading .spinner { display: block; }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 22px 0 14px;
      font-size: 12px;
      color: var(--muted-light);
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* Social */
    .social-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 40px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text);
      text-decoration: none;
      transition: background 0.15s, border-color 0.15s;
    }

    .social-btn:hover { background: #f8fafc; border-color: var(--border-strong); }

    .footer-note {
      margin-top: 22px;
      text-align: center;
      font-size: 12.5px;
      color: var(--muted-light);
    }

    @media (max-width: 480px) {
      .topbar { padding: 16px; }
      .card { padding: 24px 20px; border-radius: 14px; }
      .social-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="logo">
      <span class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
          <circle cx="12" cy="7" r="4" />
        </svg>
      </span>
      Face Attendance
    </div>
    <a class="topbar-link" href="/">Back to site</a>
  </header>

  <main class="page">
    <div class="card" role="main">
      <h1>Welcome back</h1>
      <p class="subtitle">Sign in to your account to continue.</p>

      {% if error %}
      <div class="error-banner" role="alert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" />
          <line x1="12" y1="8" x2="12" y2="12" />
          <line x1="12" y1="16" x2="12.01" y2="16" />
        </svg>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <form id="login-form" action="/login" method="POST" novalidate>
        <div class="field">
          <div class="field-row">
            <label for="email">Email</label>
          </div>
          <div class="input-wrap">
            <input id="email" name="email" type="email" placeholder="you@example.com" required autocomplete="email" spellcheck="false" style="padding-right: 13px;" />
          </div>
        </div>

        <div class="field">
          <div class="field-row">
            <label for="password">Password</label>
          </div>
          <div class="input-wrap">
            <input id="password" name="password" type="password" placeholder="Enter your password" required autocomplete="current-password" />
            <button type="button" class="eye-btn" id="eye-toggle" aria-label="Toggle password visibility">
              <svg id="eye-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-login" id="login-btn">
          <span class="btn-text">Sign in</span>
          <div class="spinner"></div>
        </button>
      </form>

      <div class="divider">or continue with</div>

      <div class="social-row">
        <a href="/login/oauth/google" class="social-btn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M12.24 10.285V14.4h6.887c-.648 2.41-2.519 4.114-5.136 4.114-3.513 0-6.386-2.873-6.386-6.386s2.873-6.386 6.386-6.386c1.636 0 3.123.614 4.268 1.636l3.19-3.19C19.295 2.222 15.937 1 12.24 1 6.053 1 12.24 6.053 12.24 12.24s5.053 11.24 11.24 11.24c6.452 0 11.24-4.527 11.24-11.24 0-.75-.068-1.486-.205-2.2H12.24z"/>
          </svg>
          Google
        </a>
        <a href="/login/oauth/github" class="social-btn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M12 1.27a11 11 0 00-3.48 21.46c.55.09.73-.24.73-.53v-1.85c-3.03.66-3.67-1.46-3.67-1.46-.5-1.27-1.2-1.61-1.2-1.61-.99-.68.08-.66.08-.66 1.1.08 1.67 1.13 1.67 1.13.97 1.66 2.54 1.18 3.17.9.1-.7.38-1.18.69-1.45-2.42-.27-4.96-1.21-4.96-5.38 0-1.19.42-2.17 1.12-2.93-.11-.28-.49-1.39.11-2.9 0 0 .91-.29 3 1.12a10.4 10.4 0 015.5 0c2.09-1.41 3-1.12 3-1.12.6 1.51.22 2.62.11 2.9.7.76 1.12 1.74 1.12 2.93 0 4.18-2.55 5.1-4.98 5.37.39.34.74 1 .74 2.02v3c0 .3.18.63.74.52A11 11 0 0012 1.27z"/>
          </svg>
          GitHub
        </a>
      </div>

      <p class="footer-note">Protected by secure authentication</p>
    </div>
  </main>

  <script>
    const pwdInput = document.getElementById('password');
    const eyeBtn = document.getElementById('eye-toggle');
    const eyeIcon = document.getElementById('eye-icon');

    const eyeOpen = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    const eyeOff = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>';

    eyeBtn.addEventListener('click', () => {
      const show = pwdInput.type === 'password';
      pwdInput.type = show ? 'text' : 'password';
      eyeIcon.innerHTML = show ? eyeOff : eyeOpen;
    });

    document.getElementById('login-form').addEventListener('submit', function () {
      const btn = document.getElementById('login-btn');
      btn.classList.add('loading');
      btn.disabled = true;
      setTimeout(() => { btn.classList.remove('loading'); btn.disabled = false; }, 8000);
    });

    document.getElementById('email').focus();

    if (window.location.search && window.history.replaceState) {
      const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
      window.history.replaceState({ path: cleanUrl }, '', cleanUrl);
    }
  </script>
  <script src="{{ url_for('static', filename='js/offline-detector.js') }}"></script>
</body>
</html>
